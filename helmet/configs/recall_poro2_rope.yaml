# Config for testing poro2 with RoPE scaling beyond 8k training context
# poro2 was trained on 8k context, using RoPE scaling to test longer sequences

# Test at 16k, 32k, 64k context lengths (2x, 4x, 8x the training length)
input_max_length: 16384,32768,65536,16384,32768,65536,16384,32768,65536,16384,32768,65536
datasets: ruler_niah_mk_2,ruler_niah_mk_2,ruler_niah_mk_2,ruler_niah_mk_3,ruler_niah_mk_3,ruler_niah_mk_3,ruler_niah_mv,ruler_niah_mv,ruler_niah_mv,json_kv,json_kv,json_kv
generation_max_length: 50,50,50,100,100,100,50,50,50,100,100,100
test_files: data/ruler/niah_multikey_2/validation_16384.jsonl,data/ruler/niah_multikey_2/validation_32768.jsonl,data/ruler/niah_multikey_2/validation_65536.jsonl,data/ruler/niah_multikey_3/validation_16384.jsonl,data/ruler/niah_multikey_3/validation_32768.jsonl,data/ruler/niah_multikey_3/validation_65536.jsonl,data/ruler/niah_multivalue/validation_16384.jsonl,data/ruler/niah_multivalue/validation_32768.jsonl,data/ruler/niah_multivalue/validation_65536.jsonl,data/json_kv/test_k220_dep6.jsonl,data/json_kv/test_k440_dep6.jsonl,data/json_kv/test_k900_dep6.jsonl
demo_files: ',,,,,,,,,,,'
use_chat_template: false
max_test_samples: 100
shots: 2
stop_new_line: false

# RoPE scaling configuration
# For poro2 trained on 8k, use factor 2.0 to test 16k, factor 4.0 for 32k, etc.
# Note: Since we test multiple lengths, you may need to adjust factor per length
# Start with factor 2.0 for initial testing, or use "dynamic" type which adapts
rope_scaling_factor: 2.0
rope_scaling_type: dynamic  # Options: linear, dynamic, yarn

model_name_or_path: LumiOpen/Poro-34B-chat  # Update to your poro2 model path
